[project]
name = "docchat"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-qdrant",
    "langchain-community",
    "langchain-nvidia-ai-endpoints",
    "pypdf",
    "pydantic-settings",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]